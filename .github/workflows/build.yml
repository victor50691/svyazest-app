name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # No signing secrets in CI -- this produces a debug-signed APK, good
      # enough to verify the app actually builds from a clean checkout.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: svyazest-app-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
